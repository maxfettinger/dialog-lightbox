<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dialog-lightbox demo</title>
    <link rel="stylesheet" href="../src/dialog-lightbox.css" />
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <main>
      <h1>dialog-lightbox</h1>
      <p>
        Tap a frame. Swipe between photos, double-tap or click to zoom, drag down to close. Videos play
        muted; the speaker turns the sound on.
      </p>

      <h2>With srcset</h2>
      <div class="film">
        <ul class="frames" id="one" role="list">
          <li>
            <figure>
              <a href="media/photo-1-1600.jpg" data-dlb-srcset="media/photo-1-1080.jpg 1080w, media/photo-1-1600.jpg 1600w">
                <img src="media/photo-1-480.jpg" alt="Blue, orange and green color field" loading="lazy" />
              </a>
              <figcaption>Photo 1 · Generated</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/photo-2-1600.jpg" data-dlb-srcset="media/photo-2-1080.jpg 1080w, media/photo-2-1600.jpg 1600w">
                <img src="media/photo-2-480.jpg" alt="Teal and orange color field" loading="lazy" />
              </a>
              <figcaption>Photo 2 · Generated</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/photo-4-1600.jpg" data-dlb-srcset="media/photo-4-1080.jpg 720w, media/photo-4-1600.jpg 1066w">
                <img src="media/photo-4-480.jpg" alt="Dark red and amber color field, portrait" loading="lazy" />
              </a>
              <figcaption>Photo 4 · Generated</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/clip-1.mp4" data-dlb-type="video" data-dlb-width="720" data-dlb-height="1280">
                <img src="media/clip-1-480.jpg" alt="A slow teal color animation with a soft tone" loading="lazy" />
              </a>
              <figcaption>Clip 1 · With sound</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/photo-3-1600.jpg" data-dlb-srcset="media/photo-3-1080.jpg 1080w, media/photo-3-1600.jpg 1600w">
                <img src="media/photo-3-480.jpg" alt="Deep blue and pale cyan color field" loading="lazy" />
              </a>
              <figcaption>Photo 3 · Generated</figcaption>
            </figure>
          </li>
        </ul>
      </div>

      <h2>Without sizes</h2>
      <div class="film">
        <ul class="frames" id="two" role="list">
          <li>
            <figure>
              <a href="media/photo-5-1600.jpg">
                <img src="media/photo-5-480.jpg" alt="Green color field, portrait" loading="lazy" />
              </a>
              <figcaption>Photo 5 · No sizes given</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/photo-6-3200.jpg">
                <img src="media/photo-6-720.jpg" alt="Very wide purple and orange panorama" loading="lazy" />
              </a>
              <figcaption>Panorama · Zoom in</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <a href="media/clip-2.mp4" data-dlb-type="video" data-dlb-audio="false">
                <img src="media/clip-2-480.jpg" alt="A slow purple and orange color animation, silent" loading="lazy" />
              </a>
              <figcaption>Clip 2 · No audio</figcaption>
            </figure>
          </li>
        </ul>
      </div>
    </main>

    <dialog aria-label="Photo viewer">
      <div data-dlb-viewport></div>
      <div class="box-bar box-top">
        <span data-dlb-counter></span>
        <button type="button" data-dlb-zoom aria-label="Zoom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m21 21-5-5M11 8v6M8 11h6" /></svg>
        </button>
        <button type="button" data-dlb-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <button type="button" class="box-side" data-dlb-prev aria-label="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button type="button" class="box-side" data-dlb-next aria-label="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
      <div class="box-bar box-bottom">
        <div class="video-bar">
          <button type="button" data-dlb-play aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 13 8-13 8V4z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3v16H7zM14 4h3v16h-3z" /></svg>
          </button>
          <span data-dlb-progress></span>
          <button type="button" data-dlb-mute aria-label="Sound">
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6" /></svg>
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM19 5a10 10 0 0 1 0 14M15.5 8.5a5 5 0 0 1 0 7" /></svg>
          </button>
        </div>
        <p class="caption"></p>
      </div>
    </dialog>

    <script type="module" src="./demo.ts"></script>
  </body>
</html>
