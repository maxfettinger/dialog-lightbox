<dialog class="box" aria-label="Photo viewer">
  <div data-dlb-viewport></div>
  <div class="box-bar">
    <span class="box-count"><span data-dlb-counter></span> / <span data-dlb-total></span></span>
    <button type="button" data-dlb-zoom>Zoom</button>
    <button type="button" data-dlb-close>Close</button>
  </div>
  <button class="box-side" type="button" data-dlb-prev aria-label="Previous">←</button>
  <button class="box-side" type="button" data-dlb-next aria-label="Next">→</button>
  <p class="box-caption"></p>
  <template data-dlb-overlay="video">
    <div class="box-video">
      <button type="button" data-dlb-play aria-label="Play"></button>
      <button type="button" data-dlb-mute aria-label="Sound off"></button>
      <button type="button" data-dlb-fullscreen>Fullscreen</button>
    </div>
    <span data-dlb-progress></span>
  </template>
</dialog>
