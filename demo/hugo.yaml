# The demo site and docs, built with the Vitrine theme (a Hugo module, demo/go.mod): bun run build:demo builds it into
# ../site. The examples run the library from static/lib, the local build, which build-demo.ts copies there and git
# ignores; their code imports "dialog-lightbox" by name, and the import map below sends that name to the local build.
baseURL: https://dialog-lightbox.maxfettinger.com/
title: dialog-lightbox
locale: en
disableKinds: [taxonomy, term, rss]
enableRobotsTXT: true

module:
  imports:
    - path: github.com/maxfettinger/vitrine

# What Vitrine needs from a site: only Markdown files are pages (an example's example.html sits next to its page),
# code colours as classes, h2 and h3 in "On this page"
contentTypes:
  text/markdown: {}
markup:
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

menus:
  main:
    - { name: Docs, pageRef: /docs, weight: 10 }
    - { name: Examples, pageRef: /examples, weight: 20 }
    - { name: npm, url: "https://www.npmjs.com/package/dialog-lightbox", weight: 30 }

params:
  description: A small, typed lightbox on the native dialog element. Swipe, zoom and video for the photos you link to.
  # version: set by build-demo.ts from package.json
  repo: https://github.com/maxfettinger/dialog-lightbox
  editPath: https://github.com/maxfettinger/dialog-lightbox/edit/main/demo/content/
  footer: MIT
  # No favicon of its own (the theme's is Vitrine's)
  favicon: { svg: "", ico: "", appleTouch: "" }
  stylesheets: [/lib/dialog-lightbox.css]
  importmap:
    dialog-lightbox: /lib/dialog-lightbox.js
