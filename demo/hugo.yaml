# The demo site: Hugo builds it into ../site (bun run build:demo). The library itself comes from the build in
# static/lib, which build-demo.ts copies there and git ignores.
baseURL: https://dialog-lightbox.maxfettinger.com/
title: dialog-lightbox
locale: en
disableKinds: [taxonomy, term, section, rss, sitemap]
markup:
  highlight:
    noClasses: false
params:
  description: A small, typed lightbox on the native dialog element. Swipe, zoom and video for the photos you link to.
  repo: https://github.com/maxfettinger/dialog-lightbox
  # Where the example code on the site loads the library from; the live examples use the local build in /lib/.
  cdn: https://cdn.jsdelivr.net/npm/dialog-lightbox@0.3/dist/
