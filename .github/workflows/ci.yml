name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # The demo site is built with Hugo and the Vitrine theme, a Hugo module (Hugo needs Go to fetch it); the
      # browser tests open it too.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run size
      - run: bun run check:types
      - run: bunx --bun playwright install --with-deps chromium webkit firefox
      - run: bun run test:browser
