name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run size
      - run: bun run check:types
      - run: bunx --bun playwright install --with-deps chromium webkit firefox
      - run: bun run test:browser
