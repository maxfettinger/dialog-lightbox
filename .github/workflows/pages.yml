name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # The demo site is built with Hugo and the Vitrine theme, a Hugo module (Hugo needs Go to fetch it); the
      # browser tests open it too.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
      - run: bun install --frozen-lockfile
      - run: bun run build:demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
