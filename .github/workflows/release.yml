name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # npm's trusted publishing (no stored token) needs a recent npm CLI; it only runs here, in CI.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: The tag must match package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run size
      - run: bun run check:types
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dialog-lightbox@$version" version > /dev/null 2>&1; then
            echo "dialog-lightbox@$version is on npm already"
          else
            # A prerelease (1.0.0-rc.1) goes to the "next" tag, so "latest" stays a stable version.
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            npm publish --access public --tag "$tag"
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
